<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0085ff" />
    <meta
      name="description"
      content="Bluesky - A decentralized social network."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon-precomposed" href="%PUBLIC_URL%/apple-touch-icon.png?v=3" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json?v=3" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.
      
      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Bluesky</title>
    <style>
      /* Pre-React loading screen - Pure CSS, no JavaScript needed */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 0.3s ease-out;
      }
      
      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        #initial-loader {
          background: #0f1419;
        }
        #initial-loader .loader-text {
          color: #8b98a5 !important;
        }
      }
      
      /* Bluesky butterfly SVG flapping */
      .loader-wing-left {
        animation: loader-flap-left 0.6s ease-in-out infinite;
      }
      
      .loader-wing-right {
        animation: loader-flap-right 0.6s ease-in-out infinite;
      }
      
      @keyframes loader-flap-left {
        0%, 100% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(0.7);
        }
      }
      
      @keyframes loader-flap-right {
        0%, 100% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(0.7);
        }
      }
      
      .loader-butterfly::before,
      .loader-butterfly::after {
        content: '';
        position: absolute;
        width: 30px;
        height: 40px;
        background: #0085ff;
        border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        animation: flutter 1.5s ease-in-out infinite;
      }
      
      .loader-butterfly::before {
        left: 0;
        transform-origin: right center;
      }
      
      .loader-butterfly::after {
        right: 0;
        transform-origin: left center;
        animation-delay: -0.75s;
      }
      
      @keyframes flutter {
        0%, 100% {
          transform: rotateY(0deg);
          opacity: 1;
        }
        50% {
          transform: rotateY(90deg);
          opacity: 0.5;
        }
      }
      
      /* Glow effect */
      .loader-glow {
        position: absolute;
        inset: -20px;
        background: radial-gradient(circle, rgba(0, 133, 255, 0.2) 0%, transparent 70%);
        filter: blur(20px);
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%, 100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }
      
      .loader-text {
        margin-top: 8px;
        font-size: 18px;
        font-weight: 500;
        color: #657786;
        animation: fade 1.5s ease-in-out infinite;
      }
      
      @keyframes fade {
        0%, 100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }
      
      /* Hide loader when React mounts */
      .react-mounted #initial-loader {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- Initial loading screen - Shows before React loads -->
    <div id="initial-loader">
      <div style="position: relative;">
        <div class="loader-glow"></div>
        <svg width="60" height="53" viewBox="0 0 64 57" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block; margin: 0 auto 24px;">
          <g class="loader-wing-left" style="transform-origin: 32px 28.5px;">
            <path d="M13.873 3.805C21.21 9.332 29.103 20.537 32 26.55v15.882c0-.338-.13.044-.41.867-1.512 4.456-7.418 21.847-20.923 7.944-7.111-7.32-3.819-14.64 9.125-16.85-7.405 1.264-15.73-.825-18.014-9.015C1.12 23.022 0 8.51 0 6.55 0-3.268 8.579-.182 13.873 3.805Z" fill="#0085ff"/>
          </g>
          <g class="loader-wing-right" style="transform-origin: 32px 28.5px;">
            <path d="M50.127 3.805C42.79 9.332 34.897 20.537 32 26.55v15.882c0-.338.13.044.41.867 1.512 4.456 7.418 21.847 20.923 7.944 7.111-7.32 3.819-14.64-9.125-16.85 7.405 1.264 15.73-.825 18.014-9.015C62.88 23.022 64 8.51 64 6.55c0-9.818-8.578-6.732-13.873-2.745Z" fill="#0085ff"/>
          </g>
        </svg>
      </div>
      <p class="loader-text">BlueSky is loading...</p>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Detect if React is taking too long to mount
      setTimeout(function() {
        const root = document.getElementById('root');
        if (!root || root.children.length === 0) {
          console.error('[Loader] React failed to mount after 10 seconds');
          console.error('[Loader] Check if JS bundles are loading correctly');
          
          // Show error message
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.innerHTML = `
              <div style="text-align: center; max-width: 500px; padding: 32px;">
                <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
                <h2 style="color: #ef4444; margin-bottom: 12px;">Application Loading Error</h2>
                <p style="color: #64748b; margin-bottom: 24px;">
                  The application failed to start. This might be due to:
                </p>
                <ul style="text-align: left; color: #64748b; margin-bottom: 24px; list-style-position: inside;">
                  <li>JavaScript files not loading</li>
                  <li>Network connection issues</li>
                  <li>Browser cache problems</li>
                </ul>
                <button onclick="location.reload(true)" style="background: #0085ff; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;">
                  Hard Reload (Ctrl+Shift+R)
                </button>
                <p style="margin-top: 16px; font-size: 14px; color: #94a3b8;">
                  Check the browser console (F12) for error details
                </p>
              </div>
            `;
            loader.style.background = '#fff';
          }
        }
      }, 10000); // 10 second timeout
      
      // Remove loader when React mounts
      const observer = new MutationObserver(function(mutations) {
        if (document.getElementById('root').children.length > 0) {
          console.log('[Loader] React mounted successfully');
          document.body.classList.add('react-mounted');
          setTimeout(function() {
            const loader = document.getElementById('initial-loader');
            if (loader) loader.remove();
          }, 300);
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
      
      // Log bundle loading
      console.log('[Loader] Waiting for React to mount...');
      console.log('[Loader] If this takes more than 10 seconds, check Network tab for failed JS requests');
    </script>

  </body>
</html>
